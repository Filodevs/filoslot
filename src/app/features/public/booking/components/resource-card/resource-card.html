<button
  (click)="onSelect()"
  class="flex flex-col items-center gap-2 p-4 rounded-sm border transition-all duration-150 min-h-11 w-full"
  [class]="selected()
            ? 'bg-indigo-500/15 border-indigo-500/50'
            : 'bg-slate-900/60 border-white/7 hover:border-white/20'"
>
  <section
    class="w-12 h-12 rounded-full grid place-items-center bg-linear-to-br text-sm font-extrabold text-white"
    [class]="avatarColor()"
  >
    {{ resource().name | initials }}
  </section>

  <section class="text-center">
    <p class="text-xs font-bold">{{ resource().name }}</p>
    <p class="text-[0.62rem] text-white/45">{{ resource().role }}</p>
  </section>

  @if (selected()) {
  <i class="pi pi-check-circle text-indigo-400 text-xs"></i>
  }
</button>
