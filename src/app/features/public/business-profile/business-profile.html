<div class="w-full flex flex-col gap-2">
  <section class="flex flex-col gap-2">
    <app-business-info
      class="w-full"
      [business]="business()"
      [bookingUrl]="bookingUrl()"
      [loading]="businessLoading()"
    />

    <app-book-card class="w-full" (goToBooking)="goToBooking()" />
  </section>

  <section class="flex flex-col gap-2">
    <app-services-list
      class="w-full"
      [services]="business()?.services || []"
      [loading]="businessLoading()"
    />

    <app-resources-list
      class="w-full"
      [resources]="resources()"
      [loading]="resourcesLoading() || businessLoading()"
    />
  </section>
</div>
