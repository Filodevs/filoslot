<div class="flex flex-col gap-4">
  <app-business-info [businessData]="businessData()" />

  <div class="flex flex-col gap-3">
    <h3 class="text-sm font-semibold text-slate-200 ml-1">
      Selecciona tu barbero
    </h3>
    <app-select
      class="w-full md:w-56"
      [options]="resources()"
      labelField="name"
      placeholder="Seleccione un recurso"
      [control]="resourceControl"
    />
  </div>

  <app-date-selector (dateChange)="selectDate($event)" />

  <app-slot-picker
    [slots]="slots()"
    [resources]="resources()"
    (changeSlot)="openConfirmation($event)"
  />
</div>
