<article>
  <h3 class="text-slate-200 font-semibold">Horarios disponibles</h3>

  <div class="grid grid-cols-3 sm:grid-cols-4 gap-3">
    @for (slot of slots(); track slot.id) {
    <button
      class="flex flex-col items-center p-3 bg-primary rounded-md transition-all disabled:opacity-40 disabled:pointer-events-none disabled:grayscale"
      [disabled]="slot.status === 'BOOKED'"
      (click)="selectSlot(slot)"
    >
      <span class="text-sm font-bold">{{ slot.startTime | date:'HH:mm' }}</span>
    </button>
    } @empty {
    <p class="text-slate-400">No hay turnos para este día.</p>
    }
  </div>
</article>
