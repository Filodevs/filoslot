<article
  class="flex flex-col gap-4 p-5 rounded-md border border-white/5 bg-surface/50 backdrop-blur-sm"
>
  <section class="flex justify-between items-start">
    <div>
      <h2 class="text-2xl font-bold text-white tracking-tight italic">{{ businessData().name }}</h2>
      <p class="text-xs text-slate-400 flex items-center gap-1 mt-1">
        <i class="pi pi-map-marker text-primary text-[10px]"></i>
        {{ businessData().address }}
      </p>
    </div>

    <div
      class="bg-white/5 px-3 py-1.5 rounded-md border border-white/10 flex flex-col items-center"
    >
      <span class="text-primary font-bold text-sm">★ {{ businessData().rating }}</span>
      <span class="text-[9px] text-slate-500 uppercase font-medium"
        >{{ businessData().reviews }} reseñas</span
      >
    </div>
  </section>

  <hr class="border-white/5" />

  <section>
    <h3 class="text-[10px] uppercase tracking-widest text-slate-500 font-bold mb-3">
      Servicios Destacados
    </h3>

    <div class="flex flex-col gap-2">
      @for (service of businessData().services; track service.name) {
      <div class="flex justify-between items-center group">
        <span class="text-sm text-slate-300 group-hover:text-white transition-colors">
          {{ service.name }}
        </span>

        <div class="flex-1 border-b border-dashed border-white/10 mx-2 mb-1"></div>

        <span class="text-sm font-mono font-bold text-primary"> ${{ service.price }} </span>
      </div>
      }
    </div>
  </section>
</article>
