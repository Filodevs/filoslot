<div class="flex flex-col gap-5">
  <section class="flex flex-col gap-1.5">
    <label
      for="resource-select"
      class="text-[0.7rem] font-bold text-white/45 uppercase tracking-widest"
    >
      Recurso
    </label>

    <div class="flex gap-2 flex-wrap">
      @for (resource of resources(); track resource.id) {
      <button
        type="button"
        (click)="selectResource(resource)"
        class="px-4 py-2 rounded-lg text-sm font-bold border transition-all duration-150 min-h-11"
        [class]="selectedResource().id === resource.id
            ? 'bg-indigo-500/20 border-indigo-500/60 text-indigo-300'
            : 'bg-transparent border-white/10 text-white/45 hover:border-white/25 hover:text-white'"
      >
        {{ resource.name }}
      </button>
      }
    </div>
  </section>

  <section class="flex flex-col gap-1.5">
    <p class="text-[0.65rem] font-bold text-white/45 uppercase tracking-widest">
      Horario semanal
    </p>

    <div class="flex flex-col gap-2">
      @for (day of currentSchedule(); track day.key) {

      <div
        class="gap-3 px-4 py-3 flex items-center rounded-xl border transition-colors duration-150"
        [class]="day.enabled
               ? 'bg-slate-800/60 border-indigo-500/25'
               : 'bg-slate-900/40 border-white/7'"
      >
        <span
          class="text-[0.7rem] font-bold w-7 shrink-0"
          [class]="day.enabled ? 'text-white' : 'text-white/30'"
        >
          {{ day.label }}
        </span>

        <button
          type="button"
          role="switch"
          [attr.aria-checked]="day.enabled"
          (click)="toggleDay(day.key)"
          class="relative w-5 h-5 rounded-full border shrink-0 transition-all duration-200 min-h-8 min-w-8 flex items-center justify-center"
          [class]="day.enabled
              ? 'bg-indigo-500 border-indigo-500'
              : 'bg-slate-700 border-white/10'"
        >
          <span
            class="absolute w-3.5 h-3.5 rounded-full bg-white transition-transform duration-200 shadow-sm"
            [class]="day.enabled ? 'translate-x-2' : '-translate-x-2'"
          >
          </span>
        </button>

        <!-- HORARIOS -->
        @if (day.enabled) {
        <div
          class="flex flex-col md:flex-row items-center flex-1 animate-[fadeSlide_0.15s_ease]"
        >
          <div class="w-full flex flex-col gap-0.5 flex-1">
            <label
              [for]="'start-' + day.key"
              class="text-[0.58rem] font-bold text-white/30 uppercase tracking-widest"
            >
              Desde
            </label>

            <input
              [id]="'start-' + day.key"
              type="time"
              [value]="day.start"
              (change)="updateTime(day.key, 'start', $any($event.target).value)"
              class="w-full px-2 py-1.5 rounded-lg text-xs font-bold text-center bg-slate-900/80 border border-white/10 text-white outline-none focus:border-indigo-500/60 focus:ring-1 focus:ring-indigo-500/30 transition-all duration-150"
            />
          </div>

          <span class="hidden md:block text-white/25 text-xs mt-3 shrink-0"
            >→</span
          >

          <div class="w-full flex flex-col gap-0.5 flex-1">
            <label
              [for]="'end-' + day.key"
              class="text-[0.58rem] font-bold text-white/30 uppercase tracking-widest"
            >
              Hasta
            </label>
            <input
              [id]="'end-' + day.key"
              type="time"
              [value]="day.end"
              (change)="updateTime(day.key, 'end', $any($event.target).value)"
              class="w-full px-2 py-1.5 rounded-lg text-xs font-bold text-center bg-slate-900/80 border border-white/10 text-white outline-none focus:border-indigo-500/60 focus:ring-1 focus:ring-indigo-500/30 transition-all duration-150"
            />
          </div>
        </div>
        } @else {
        <span class="text-[0.7rem] text-white/25 italic flex-1">Día libre</span>
        }
      </div>
      }
    </div>
  </section>

  <section class="flex flex-col gap-1.5">
    <label
      for="interval-select"
      class="text-[0.7rem] font-bold text-white/45 uppercase tracking-widest"
    >
      Intervalo entre slots
    </label>

    <div class="grid grid-cols-4 gap-2">
      @for (interval of intervals; track interval.value) {
      <button
        type="button"
        (click)="updateInterval(interval.value)"
        class="py-2.5 rounded-lg text-xs font-bold border transition-all duration-150 min-h-11"
        [class]="currentInterval() === interval.value
            ? 'bg-cyan-400/15 border-cyan-400/50 text-cyan-300'
            : 'bg-transparent border-white/10 text-white/45 hover:border-white/25 hover:text-white'"
      >
        {{ interval.value }}m
      </button>
      }
    </div>
  </section>

  <button
    type="button"
    (click)="save()"
    class="w-full py-3.5 rounded-lg font-bold text-sm text-white bg-indigo-500 hover:bg-indigo-400 active:scale-[0.99] transition-all duration-150 min-h-11"
  >
    Guardar disponibilidad
  </button>
</div>
