<form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-5">
  <section class="flex flex-col gap-1.5">
    <label
      for="name"
      class="text-[0.7rem] font-bold text-white/45 uppercase tracking-widest"
    >
      Nombre del negocio
    </label>

    <input
      pInputText
      formControlName="name"
      placeholder="Ej: FiloSlot Barber"
      class="w-full px-4 py-3 rounded-lg text-sm font-medium bg-slate-800/80 border text-white placeholder:text-white/25 outline-none transition-all duration-150 focus:ring-2 focus:ring-indigo-500/40 focus:border-indigo-500/60"
      [class]="nameInvalid
        ? 'border-red-500/50 bg-red-500/5'
        : 'border-white/10 hover:border-white/20'"
    />

    @if (nameInvalid) {
    <label for="name" class="text-sm text-red-400 flex items-center gap-1">
      ⚠ Ingresa el nombre del negocio (mínimo 3 caracteres)
    </label>
    }
  </section>

  <section class="flex flex-col gap-1.5">
    <label
      for="address"
      class="text-[0.7rem] font-bold text-white/45 uppercase tracking-widest"
    >
      Dirección
    </label>

    <input
      pInputText
      formControlName="address"
      placeholder="Ej: Calle 123, Centro"
      class="w-full px-4 py-3 rounded-lg text-sm font-medium bg-slate-800/80 border text-white placeholder:text-white/25 outline-none transition-all duration-150 focus:ring-2 focus:ring-indigo-500/40 focus:border-indigo-500/60"
      [class]="addressInvalid
        ? 'border-red-500/50 bg-red-500/5'
        : 'border-white/10 hover:border-white/20'"
    />

    @if (addressInvalid) {
    <label for="address" class="text-sm text-red-400 flex items-center gap-1">
      ⚠ La dirección es requerida
    </label>
    }
  </section>

  <section class="flex flex-col gap-1.5">
    <label
      for="phone"
      class="text-[0.7rem] font-bold text-white/45 uppercase tracking-widest"
    >
      Teléfono de contacto
    </label>

    <input
      pInputText
      formControlName="phone"
      type="tel"
      placeholder="Ej: +57 300 000 0000"
      class="w-full px-4 py-3 rounded-lg text-sm font-medium bg-slate-800/80 border text-white placeholder:text-white/25 outline-none transition-all duration-150 focus:ring-2 focus:ring-indigo-500/40 focus:border-indigo-500/60"
      [class]="phoneInvalid
        ? 'border-red-500/50 bg-red-500/5'
        : 'border-white/10 hover:border-white/20'"
    />

    @if (phoneInvalid) {
    <label for="phone" class="text-sm text-red-400 flex items-center gap-1">
      ⚠ El teléfono es requerido
    </label>
    }
  </section>

  <!-- SUBMIT -->
  <button
    type="submit"
    class="w-full py-3.5 mt-1 rounded-lg font-bold text-sm text-white bg-indigo-500 hover:bg-indigo-400 active:scale-[0.99] transition-all duration-150 min-h-11"
  >
    Guardar información
  </button>
</form>
