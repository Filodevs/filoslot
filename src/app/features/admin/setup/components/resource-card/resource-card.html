<article
  class="flex flex-col gap-2 p-4 bg-slate-800/60 border border-white/7 rounded-xl text-center transition-colors duration-150 hover:border-indigo-500/30"
>
  <div class="w-full flex justify-between gap-2">
    <section
      class="w-10 h-10 rounded-full grid place-items-center self-start bg-linear-to-br font-bold text-base text-white shrink-0"
      [class]="resource().id | avatarColor"
    >
      {{ resource().name | initials }}
    </section>

    <section class="w-1/2 flex flex-col items-start gap-0.5">
      <p class="w-full text-left text-sm font-bold truncate">
        {{ resource().name }}
      </p>
      <p class="w-full text-left text-[0.68rem] text-white/45 truncate">
        {{ resource().role }}
      </p>
    </section>

    <section class="w-fit flex gap-1">
      <button
        type="button"
        (click)="editResourceEvent.emit(resource())"
        class="w-8 h-8 rounded-lg border border-white/10 grid place-items-center text-white/45 text-xs hover:border-indigo-500/60 hover:text-indigo-400 hover:bg-indigo-500/10 transition-all duration-150 min-h-11 min-w-11"
      >
        <i class="pi pi-pencil"></i>
      </button>

      <button
        type="button"
        (click)="deleteResourceEvent.emit(resource().id)"
        class="w-8 h-8 rounded-lg border border-white/10 grid place-items-center text-white/45 text-xs hover:border-red-500/50 hover:text-red-400 hover:bg-red-500/10 transition-all duration-150 min-h-11 min-w-11"
      >
        <i class="pi pi-trash"></i>
      </button>
    </section>
  </div>

  <div class="mt-2 flex gap-2 items-start">
    @for (service of services(); track service.id) { @if
    (resource().serviceIds?.includes(service.id)) {
    <span
      class="inline-block px-2 py-0.5 mr-1 mb-1 text-[0.65rem] font-medium text-white/45 bg-slate-700/50 rounded"
    >
      {{ service.name }}
    </span>
    } }
  </div>
</article>
