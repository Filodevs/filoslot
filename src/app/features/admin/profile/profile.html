<div class="w-full flex flex-col gap-4">
  <section class="flex flex-col md:flex-row gap-4">
    <app-business-info
      class="w-full"
      [business]="business()"
      [bookingUrl]="bookingUrl()"
      [loading]="businessLoading()"
    />

    <app-profile-share
      class="w-full"
      [bookingUrl]="bookingUrl()"
      [business]="business()"
      [loading]="businessLoading()"
    />
  </section>

  <section class="flex flex-col md:flex-row gap-4">
    <app-services-list
      class="w-full"
      [services]="services()"
      [loading]="servicesLoading()"
    />

    <app-resources-list
      class="w-full"
      [resources]="resources()"
      [loading]="resourcesLoading()"
    />
  </section>
</div>
