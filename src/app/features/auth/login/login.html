<div class="p-4 min-h-screen flex flex-col items-center justify-center gap-4">
  <header class="flex flex-col items-center gap-3 mb-10">
    <section
      class="w-16 h-16 rounded-2xl bg-indigo-500 grid place-items-center font-extrabold text-2xl text-white shadow-[0_8px_32px_rgba(99,102,241,0.4)]"
    >
      F
    </section>

    <section class="text-center">
      <h1 class="text-2xl font-extrabold tracking-tight">
        <span class="text-indigo-400">FILO</span>SLOT
      </h1>

      <p class="text-xs text-white/45 mt-1">Panel de administración</p>
    </section>
  </header>

  <div
    class="w-full max-w-100 flex flex-col gap-4 bg-slate-900/60 backdrop-blur-xl border border-white/7 rounded-sm p-6 shadow-[0_24px_60px_rgba(0,0,0,0.4)]"
  >
    <section>
      <h2 class="text-lg font-extrabold tracking-tight mb-1">
        Bienvenido de vuelta
      </h2>

      <p class="text-xs text-white/45">
        Ingresa tus credenciales para continuar
      </p>
    </section>

    <form
      [formGroup]="form"
      (ngSubmit)="onSubmit()"
      class="flex flex-col gap-5"
    >
      <app-input
        [control]="form.controls.email"
        label="Email"
        placeholder="tu@email.com"
        type="email"
      />

      <app-input
        [control]="form.controls.password"
        label="Contraseña"
        placeholder="••••••••"
        [type]="showPass() ? 'text' : 'password'"
      />

      @if (errorMsg()) {
      <div
        class="flex items-center gap-2.5 px-4 py-3 rounded-xl bg-red-500/10 border border-red-500/25 animate-[fadeSlide_0.2s_ease]"
      >
        <i class="pi pi-exclamation-triangle text-red-400 text-sm shrink-0"></i>
        <p class="text-xs font-semibold text-red-300">{{ errorMsg() }}</p>
      </div>
      }

      <app-button type="submit" [disabled]="isLoading()">
        @if (isLoading()) {
        <span class="flex items-center justify-center gap-2">
          <i class="pi pi-spinner pi-spin text-sm"></i>
          Iniciando sesión...
        </span>
        } @else { Iniciar sesión }
      </app-button>
    </form>

    <app-button variant="primary" (click)="navigateToDirectory()">
      <span class="flex items-center gap-1.5">
        <i class="pi pi-arrow-left text-xs"></i>
        Volver al directorio
      </span>
    </app-button>
  </div>
</div>
