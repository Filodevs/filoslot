<div class="flex flex-col gap-1.5">
  @if (label()) {
  <label
    for=""
    class="text-[0.7rem] font-bold text-white/45 uppercase tracking-widest"
  >
    {{ label() }}
  </label>
  }

  <p-inputnumber
    class="w-full"
    [formControl]="control()"
    [min]="min() ?? undefined"
    [max]="max() ?? undefined"
    [step]="step()"
    [placeholder]="placeholder()"
    inputStyleClass="w-full px-4 py-3 rounded-lg text-sm font-medium
                     bg-slate-800/80 text-white placeholder:text-white/25
                     outline-none transition-all duration-150
                     focus:ring-2 focus:ring-indigo-500/40 focus:border-indigo-500/60"
    [class]="isInvalid ? 'border-red-500/50' : 'border-white/10'"
  />

  @if (isInvalid && activeError) {
  <span class="text-sm text-red-400 flex items-center gap-1">
    ⚠ {{ activeError }}
  </span>
  }
</div>
