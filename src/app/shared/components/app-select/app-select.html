<div>
  @if(label()) {
  <span class="block text-sm font-medium mb-2"> {{ label() }} </span>
  }

  <p-select
    class="w-full"
    [options]="options()"
    [formControl]="control()"
    optionLabel="name"
    optionValue="id"
    [placeholder]="placeholder()"
    (onChange)="selectionChange.emit($event.value)"
  />
</div>
