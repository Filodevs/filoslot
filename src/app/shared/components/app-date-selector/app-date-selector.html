@if (showNavigation()) {
<div class="hidden sm:flex items-center justify-between mb-1">
  <button
    (click)="prev()"
    class="w-9 h-9 rounded-xl border border-white/10 grid place-items-center text-white/45 hover:border-indigo-500/50 hover:text-indigo-400 transition-all duration-150 min-h-11 min-w-11"
  >
    <i class="pi pi-chevron-left text-xs"></i>
  </button>

  <div class="text-center">
    <p class="text-sm font-extrabold tracking-tight">{{ formattedDate }}</p>
    @if (isToday(selectedDate())) {
    <span class="text-[0.6rem] font-bold text-indigo-400">Hoy</span>
    }
  </div>

  <button
    (click)="next()"
    class="w-9 h-9 rounded-xl border border-white/10 grid place-items-center text-white/45 hover:border-indigo-500/50 hover:text-indigo-400 transition-all duration-150 min-h-11 min-w-11"
  >
    <i class="pi pi-chevron-right text-xs"></i>
  </button>
</div>
}

<div
  class="flex gap-2 overflow-x-auto scrollbar-none"
  [class.justify-between]="showNavigation()"
>
  @for (day of days(); track day.fullDate.toDateString()) {
  <button
    (click)="select(day.fullDate)"
    class="px-3 py-2 min-w-12 md:w-20 md:h-14 flex flex-col items-center justify-center gap-0.5 rounded-sm border cursor-pointer transition-all duration-150 min-h-11"
    [class]="
      isSelected(day.fullDate)
        ? 'bg-indigo-500 border-indigo-500 text-white'
        : 'bg-slate-900/60 border-white/7 text-white/60 hover:border-white/20 hover:text-white'
    "
  >
    <span class="text-[0.55rem] font-bold uppercase">{{ day.dayName }}</span>
    <span class="text-base font-extrabold leading-none"
      >{{ day.dayNumber }}</span
    >
    @if (showNavigation() && isToday(day.fullDate) && !isSelected(day.fullDate))
    {
    <span class="text-[0.5rem] font-bold text-indigo-400">hoy</span>
    }
  </button>
  }
</div>
