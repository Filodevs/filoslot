<div
  class="flex items-center px-2 py-1 bg-slate-900/95 backdrop-blur-xl border-t border-white/7 safe-area-pb"
>
  @for (tab of tabs; track tab.route) {
  <button
    [routerLink]="tab.route"
    class="flex-1 flex flex-col items-center gap-1 py-2 px-1 rounded-xl min-h-11 transition-all duration-150"
    [class]="isActive(tab.route)
              ? 'text-indigo-400'
              : 'text-white/35 hover:text-white/60'"
  >
    <div class="relative">
      <i class="pi text-xl" [class]="tab.icon"></i>

      @if (isActive(tab.route)) {
      <span
        class="absolute -bottom-1 left-1/2 -translate-x-1/2 w-1 h-1 rounded-full bg-indigo-400"
      >
      </span>
      }
    </div>

    <span class="text-[0.55rem] font-bold">{{ tab.label }}</span>
  </button>
  }

  <button
    (click)="logout()"
    class="flex-1 flex flex-col items-center gap-1 py-2 px-1 rounded-xl min-h-11 text-white/35 hover:text-red-400 transition-all duration-150"
  >
    <i class="pi pi-sign-out text-xl"></i>
    <span class="text-[0.55rem] font-bold">Salir</span>
  </button>
</div>
